<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube - XENA Sandbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Roboto', sans-serif; background: #0f0f0f; color: #f1f1f1; overflow-x: hidden; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 56px; position: sticky; top: 0; background: #0f0f0f; z-index: 100; border-bottom: 1px solid #272727; }
    .logo { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .logo-icon { width: 28px; height: 28px; background: #ff0000; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: white; }
    .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    .search-bar { flex: 1; max-width: 640px; margin: 0 40px; display: flex; }
    .search-bar input { flex: 1; height: 40px; background: #121212; border: 1px solid #303030; border-radius: 20px 0 0 20px; padding: 0 16px; color: white; font-size: 14px; outline: none; }
    .search-bar input:focus { border-color: #1c62b9; }
    .search-bar button { width: 64px; height: 40px; background: #222222; border: 1px solid #303030; border-left: none; border-radius: 0 20px 20px 0; cursor: pointer; color: white; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    .search-bar button:hover { background: #333; }
    .main { display: flex; padding: 16px 24px; gap: 24px; max-width: 1400px; margin: 0 auto; }
    .player-section { flex: 1; min-width: 0; }
    .player-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 12px; overflow: hidden; }
    .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .video-info { padding: 12px 0; }
    .video-title { font-size: 18px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
    .video-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #aaa; }
    .video-meta .channel { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .channel-avatar { width: 36px; height: 36px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 14px; color: white; }
    .channel-name { color: #f1f1f1; font-weight: 500; }
    .sidebar { width: 360px; flex-shrink: 0; }
    .search-results, .home-grid { display: flex; flex-direction: column; gap: 8px; }
    .video-card { display: flex; gap: 8px; padding: 8px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .video-card:hover { background: #1a1a1a; }
    .video-card .thumb { width: 168px; height: 94px; border-radius: 8px; background: #333; flex-shrink: 0; overflow: hidden; position: relative; }
    .video-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .video-card .thumb .duration { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.8); color: white; font-size: 11px; padding: 1px 4px; border-radius: 2px; font-weight: 500; }
    .video-card .info { flex: 1; min-width: 0; }
    .video-card .info h3 { font-size: 13px; font-weight: 500; line-height: 1.3; max-height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .video-card .info p { font-size: 11px; color: #aaa; margin-top: 4px; }
    .shorts-section { margin: 24px 0; }
    .shorts-section h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
    .shorts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .short-card { cursor: pointer; border-radius: 8px; overflow: hidden; transition: transform 0.15s; }
    .short-card:hover { transform: scale(1.02); }
    .short-card img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 8px; background: #333; }
    .short-card h3 { font-size: 12px; font-weight: 500; margin-top: 4px; padding: 0 4px; }
    .short-card p { font-size: 11px; color: #aaa; padding: 0 4px; }
    .hidden { display: none !important; }
    .loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: #aaa; font-size: 14px; }
    .loading span { width: 8px; height: 8px; border-radius: 50%; background: #888; margin: 0 4px; animation: bounce 1.4s infinite ease-in-out both; }
    .loading span:nth-child(2) { animation-delay: 0.16s; }
    .loading span:nth-child(3) { animation-delay: 0.32s; }
    @keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }
    @media (max-width: 900px) { .main { flex-direction: column; } .sidebar { width: 100%; } }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo" onclick="location.reload()">
      <div class="logo-icon">▶</div>
      <span class="logo-text">YouTube</span>
    </div>
    <div class="search-bar">
      <input id="searchInput" type="text" placeholder="Search" onkeydown="if(event.key==='Enter') searchVideo()">
      <button onclick="searchVideo()">🔍</button>
    </div>
    <div></div>
  </div>

  <div class="main">
    <div class="player-section">
      <div id="playerContainer" class="hidden">
        <div class="player-wrapper">
          <iframe id="playerFrame" src="" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="video-info">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-meta">
            <div class="channel" onclick="openChannel(currentChannelName)">
              <div class="channel-avatar" id="channelAvatar">U</div>
              <span class="channel-name" id="channelName">Unknown</span>
            </div>
            <span id="videoViews"></span>
            <span id="videoPublished"></span>
          </div>
        </div>
      </div>
      <div id="homeSection">
        <h2 style="font-size:20px;font-weight:700;margin-bottom:16px;">Recommended</h2>
        <div id="homeGrid" class="home-grid"></div>
        <div id="shortsSection" class="shorts-section"></div>
      </div>
    </div>
    <div class="sidebar">
      <h3 style="font-size:15px;font-weight:600;margin-bottom:12px;">Search Results</h3>
      <div id="searchResults" class="search-results"></div>
      <div id="sidebarLoading" class="loading"><span></span><span></span><span></span></div>
    </div>
  </div>

  <script>
    let currentVideoId = null;
    let currentChannelName = '';
    let allVideos = [];

    function getVideoId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('v');
    }

    function getRecommendedFromStorage() {
      try { return JSON.parse(localStorage.getItem('xena_yt_recommended')); } catch { return null; }
    }
    function setRecommendedInStorage(data) {
      localStorage.setItem('xena_yt_recommended', JSON.stringify(data));
    }

    async function loadHomeView() {
      document.getElementById('playerContainer').classList.add('hidden');
      document.getElementById('homeSection').classList.remove('hidden');
      document.getElementById('searchResults').innerHTML = '';
      
      let recommended = getRecommendedFromStorage();
      if (!recommended || recommended.length === 0) {
        try {
          document.getElementById('sidebarLoading').style.display = 'flex';
          const trendRes = await fetch('/api/yt/trending');
          const trendData = await trendRes.json();
          if (trendData && trendData.length > 0) {
            setRecommendedInStorage(trendData);
            recommended = trendData;
          }
        } catch (e) {
          console.warn("Failed to fetch trending", e);
        } finally {
          document.getElementById('sidebarLoading').style.display = 'none';
        }
      }
      
      if (!recommended || recommended.length === 0) {
        recommended = [
          { id: 'jfKfPfyJRdk', title: 'Lofi Hip Hop Radio — Beats to Study/Relax', channel: 'Lofi Girl', duration: 'LIVE', views: '12M views', thumbnail: 'https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg' },
          { id: '8hly31xK7e0', title: 'Harvard CS50 - Computer Science Course', channel: 'Harvard', duration: '2:15:30', views: '5.4M views', thumbnail: 'https://i.ytimg.com/vi/8hly31xK7e0/hqdefault.jpg' },
          { id: 'rtTiPz__V-g', title: 'Chill Synthwave Mix — Coding Beats', channel: 'Synthwave', duration: '1:05:12', views: '980K views', thumbnail: 'https://i.ytimg.com/vi/rtTiPz__V-g/hqdefault.jpg' },
          { id: '5H7Ew2tO6uM', title: 'Relaxing Rain & Ocean Waves', channel: 'Rain Sounds', duration: '4:00:00', views: '8.1M views', thumbnail: 'https://i.ytimg.com/vi/5H7Ew2tO6uM/hqdefault.jpg' },
          { id: 'W6NZfCO5SIk', title: 'JavaScript Programming Crash Course', channel: 'Programming', duration: '1:42:15', views: '3.2M views', thumbnail: 'https://i.ytimg.com/vi/W6NZfCO5SIk/hqdefault.jpg' },
          { id: 'vGAtb8PswC8', title: 'Mechanical Keyboard Soundscapes', channel: 'ASMR', duration: '1:12:44', views: '640K views', thumbnail: 'https://i.ytimg.com/vi/vGAtb8PswC8/hqdefault.jpg' }
        ];
      }
      
      allVideos = recommended;
      renderHomeGrid(recommended);
      renderShorts(recommended);
    }

    function renderHomeGrid(videos) {
      const grid = document.getElementById('homeGrid');
      grid.innerHTML = videos.slice(0, 6).map(v => `
        <div class="video-card" onclick="playVideo('${v.id}')">
          <div class="thumb">
            <img src="${v.thumbnail || 'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg'}" alt="" loading="lazy">
            <span class="duration">${v.duration || 'HD'}</span>
          </div>
          <div class="info">
            <h3>${v.title || 'Untitled'}</h3>
            <p>${v.channel || 'Unknown'} • ${v.views || ''} • ${v.published || ''}</p>
          </div>
        </div>
      `).join('');
    }

    function renderShorts(videos) {
      const section = document.getElementById('shortsSection');
      const shorts = videos.filter(v => v.duration && (v.duration.includes('LIVE') || parseInt(v.duration) < 120));
      const pool = shorts.length >= 4 ? shorts : videos.slice(0, 6);
      section.innerHTML = `
        <h2>🔥 Shorts</h2>
        <div class="shorts-grid">
          ${pool.slice(0, 6).map(v => `
            <div class="short-card" onclick="playVideo('${v.id}')">
              <img src="${v.thumbnail || 'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg'}" alt="" loading="lazy">
              <h3>${(v.title || '').slice(0, 40)}</h3>
              <p>${v.views || ''}</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function searchVideo() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      
      document.getElementById('sidebarLoading').style.display = 'flex';
      document.getElementById('searchResults').innerHTML = '';
      
      try {
        const res = await fetch('/api/yt/search?q=' + encodeURIComponent(q));
        const data = await res.json();
        document.getElementById('sidebarLoading').style.display = 'none';
        
        if (data && data.length > 0) {
          allVideos = data;
          document.getElementById('searchResults').innerHTML = data.map(v => `
            <div class="video-card" onclick="playVideo('${v.id}')">
              <div class="thumb">
                <img src="${v.thumbnail || 'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg'}" alt="" loading="lazy">
                <span class="duration">${v.duration || 'HD'}</span>
              </div>
              <div class="info">
                <h3>${v.title || 'Untitled'}</h3>
                <p>${v.channel || 'Unknown'} • ${v.views || ''} • ${v.published || ''}</p>
              </div>
            </div>
          `).join('');
          
          // Auto-play first result
          if (data[0]) playVideo(data[0].id, data[0].channel, data[0].title, data[0].views, data[0].published);
        } else {
          document.getElementById('searchResults').innerHTML = '<p style="color:#aaa;padding:20px;text-align:center;">No results found</p>';
        }
      } catch (e) {
        document.getElementById('sidebarLoading').style.display = 'none';
        document.getElementById('searchResults').innerHTML = '<p style="color:#aaa;padding:20px;text-align:center;">Search failed. Try again.</p>';
      }
    }

    function playVideo(id, channel, title, views, published) {
      currentVideoId = id;
      currentChannelName = channel || 'Unknown';
      
      document.getElementById('homeSection').classList.add('hidden');
      document.getElementById('playerContainer').classList.remove('hidden');
      
      // Use embed with modestbranding for cleaner look
      document.getElementById('playerFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1&rel=0`;
      document.getElementById('videoTitle').textContent = title || 'Playing...';
      document.getElementById('channelName').textContent = currentChannelName;
      document.getElementById('channelAvatar').textContent = (currentChannelName[0] || 'U').toUpperCase();
      document.getElementById('videoViews').textContent = views || '';
      document.getElementById('videoPublished').textContent = published || '';
      
      // Update sidebar with related videos
      const related = allVideos.filter(v => v.id !== id).slice(0, 8);
      if (related.length > 0) {
        document.getElementById('searchResults').innerHTML = related.map(v => `
          <div class="video-card" onclick="playVideo('${v.id}','${(v.channel||'').replace(/'/g,"\\'")}','${(v.title||'').replace(/'/g,"\\'")}','${v.views||''}','${v.published||''}')">
            <div class="thumb">
              <img src="${v.thumbnail || 'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg'}" alt="" loading="lazy">
              <span class="duration">${v.duration || 'HD'}</span>
            </div>
            <div class="info">
              <h3>${v.title || 'Untitled'}</h3>
              <p>${v.channel || 'Unknown'} • ${v.views || ''}</p>
            </div>
          </div>
        `).join('');
      }
      
      // Update URL without reloading
      window.history.replaceState({}, '', '/view?v=' + id);
    }

    function openChannel(name) {
      if (!name) return;
      document.getElementById('searchInput').value = name;
      searchVideo();
    }

    // Init
    const videoId = getVideoId();
    if (videoId) {
      playVideo(videoId);
    } else {
      loadHomeView();
    }
  </script>
</body>
</html>
